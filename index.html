<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IxChat Pro</title>
  <style>
    :root { --bubble-mine: #005c4b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #login-screen { display: flex; justify-content: center; align-items: center; height: 100%; padding: 20px; }
    .box { background: #202c33; padding: 24px; border-radius: 14px; width: 100%; max-width: 360px; text-align: center; }
    .box h2 { color: #00a884; margin-bottom: 8px; }
    input { width: 100%; padding: 11px 14px; margin: 7px 0; border-radius: 8px; border: 1px solid #2a3942; background: #111b21; color: white; font-size: 15px; outline: none; }
    .btn { width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 8px; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-sm { padding: 6px 10px; font-size: 12px; width: auto; margin: 0; }
    .btn-red { background: #ef4444; color: white; }
    .btn-dark { background: #2a3942; color: #e9edef; }
    #home-screen { display: none; flex-direction: column; height: 100%; }
    .topbar { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    #announcement-bar { background: rgba(0, 168, 132, 0.2); border-bottom: 1px solid #00a884; padding: 7px 12px; font-size: 12px; text-align: center; }
    .tabs { display: flex; background: #202c33; border-bottom: 1px solid #2a3942; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: bold; color: #8696a0; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #00a884; border-bottom-color: #00a884; }
    .list-area { flex: 1; overflow-y: auto; padding: 10px; }
    .chat-item { background: #111b21; border: 1px solid #202c33; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .badge { background: #00a884; color: #111b21; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    .badge-admin { background: #ef4444; color: white; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 15px; z-index: 50; }
    .modal-content { background: #202c33; padding: 18px; border-radius: 12px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; }
    .color-dots { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
    .dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    #chat-screen { display: none; flex-direction: column; height: 100%; background-size: cover; background-position: center; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 11px; border-radius: 10px; background: #202c33; align-self: flex-start; word-wrap: break-word; }
    .msg.mine { background: var(--bubble-mine); align-self: flex-end; }
    .msg-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: #8696a0; margin-bottom: 3px; }
    .red-tick { background: #ef4444; color: white; border-radius: 50%; width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; }
    .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 10px; color: rgba(255,255,255,0.65); margin-top: 4px; }
    .seen-blue { color: #53bdeb; font-weight: bold; }
    .del-btn { background: none; border: none; color: #ef4444; font-size: 11px; cursor: pointer; margin-left: 6px; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .input-bar { background: #202c33; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
    .input-bar input[type="text"] { flex: 1; margin: 0; border-radius: 20px; background: #2a3942; border: none; }
    .icon-btn { background: #2a3942; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="box">
      <h2>IxChat Pro</h2>
      <p style="font-size:12px; color:#8696a0; margin-bottom:12px;">Private Network</p>
      <input type="email" id="email" placeholder="Apni Email ID daalein">
      <input type="password" id="password" placeholder="Password daalein">
      <button class="btn" id="login-btn">Login Karein</button>
      <p id="login-error" style="color:#ef4444; font-size:12px; margin-top:10px; font-weight:bold;"></p>
    </div>
  </div>
  <div id="home-screen">
    <div class="topbar">
      <div><h3 style="font-size:17px;">IxChat</h3><span id="my-email-label" style="font-size:11px; color:#8696a0;"></span></div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-sm btn-dark" id="open-theme-btn">Theme</button>
        <button class="btn btn-sm" id="open-group-btn">+ Group</button>
        <button id="admin-open-btn" class="btn btn-sm btn-red" style="display:none;">Admin</button>
        <button class="btn btn-sm btn-dark" id="logout-btn">Exit</button>
      </div>
    </div>
    <div id="announcement-bar">Welcome to IxChat Pro!</div>
    <div class="tabs">
      <div class="tab active" id="tab-chats">My Chats & Groups</div>
      <div class="tab" id="tab-users">All Users (DM)</div>
      <div class="tab" id="tab-spy" style="display:none; color:#ef4444;">All Rooms</div>
    </div>
    <div class="list-area" id="main-list"></div>
  </div>
  <div id="chat-screen">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-sm btn-dark" id="back-btn">Back</button>
        <div><h4 id="room-title" style="font-size:15px;">Chat</h4><span id="room-sub" style="font-size:11px; color:#8696a0;"></span></div>
      </div>
      <button class="btn btn-sm btn-dark" id="chat-theme-btn">Color</button>
    </div>
    <div id="messages"></div>
    <div class="input-bar">
      <input type="file" id="photo-input" accept="image/*" style="display:none;">
      <button class="icon-btn" id="cam-btn">Cam</button>
      <input type="text" id="msg-input" placeholder="Message likhein...">
      <button class="icon-btn" style="background:#00a884; color:#111b21; font-weight:bold;" id="send-btn">Send</button>
    </div>
  </div>
  <div class="modal" id="group-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:10px;">Naya Group Banayein</h3>
      <input type="text" id="new-group-name" placeholder="Group ka naam likhein...">
      <div id="group-user-checkboxes" style="max-height:150px; overflow-y:auto; margin:8px 0; text-align:left;"></div>
      <button class="btn" id="create-group-btn">Create Group</button>
      <button class="btn btn-dark" id="close-group-btn">Cancel</button>
    </div>
  </div>
  <div class="modal" id="theme-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:8px;">Chat Style</h3>
      <div class="color-dots">
        <div class="dot" style="background:#005c4b;" data-color="#005c4b"></div>
        <div class="dot" style="background:#1d4ed8;" data-color="#1d4ed8"></div>
        <div class="dot" style="background:#7e22ce;" data-color="#7e22ce"></div>
        <div class="dot" style="background:#be123c;" data-color="#be123c"></div>
        <div class="dot" style="background:#374151;" data-color="#374151"></div>
      </div>
      <input type="file" id="my-wallpaper-input" accept="image/*">
      <button class="btn btn-dark" id="clear-wall-btn">Remove Wallpaper</button>
      <button class="btn" id="close-theme-btn">Done</button>
    </div>
  </div>
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <h3 style="color:#ef4444; margin-bottom:8px;">Admin Controls</h3>
      <input type="text" id="banner-input" placeholder="Top Notice likhein...">
      <button class="btn" id="update-banner-btn">Update Notice</button>
      <button class="btn btn-dark" id="close-admin-btn">Close</button>
    </div>
  </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgv2pmfJv_ki7iZkdWlU4u1RbLM0p3JsA",
      authDomain: "ixchat-92440.firebaseapp.com",
      projectId: "ixchat-92440",
      storageBucket: "ixchat-92440.firebasestorage.app",
      messagingSenderId: "164527066733",
      appId: "1:164527066733:web:50bcffc97f0dc90e8f3964",
      measurementId: "G-Q06D8YLFE1"
    };

    const ADMIN_EMAIL = "ajitkumar180081@gmail.com";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, isAdmin = false, currentTab = 'chats', allUsers = [], allRooms = [], activeRoomId = null, unsubMessages = null;

    const savedColor = localStorage.getItem('ix_bubble_color');
    if (savedColor) document.documentElement.style.setProperty('--bubble-mine', savedColor);
    const savedWall = localStorage.getItem('ix_wallpaper');
    if (savedWall) document.getElementById('chat-screen').style.backgroundImage = "url(" + savedWall + ")";

    document.getElementById('login-btn').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errBox = document.getElementById('login-error');
      if (!email || !pass) { errBox.innerText = "Email aur password daalein!"; return; }
      errBox.style.color = "#00a884"; errBox.innerText = "Login ho raha hai...";
      signInWithEmailAndPassword(auth, email, pass).catch(e => { errBox.style.color = "#ef4444"; errBox.innerText = "Error: " + e.code; });
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
        document.getElementById('my-email-label').innerText = user.email + (isAdmin ? " (Admin)" : "");
        if (isAdmin) { document.getElementById('admin-open-btn').style.display = 'inline-block'; document.getElementById('tab-spy').style.display = 'block'; }
        try {
          await setDoc(doc(db, "users", user.email.toLowerCase()), { email: user.email.toLowerCase(), lastSeen: Date.now() }, { merge: true });
          await setDoc(doc(db, "rooms", "global_group"), { name: "IxChat Global Group", type: "public", members: ["ALL"], createdBy: ADMIN_EMAIL }, { merge: true });
        } catch (err) {}
        onSnapshot(doc(db, "settings", "config"), s => { if (s.exists() && s.data().banner) document.getElementById('announcement-bar').innerText = s.data().banner; });
        onSnapshot(collection(db, "users"), s => { allUsers = []; s.forEach(d => allUsers.push(d.data())); renderList(); });
        onSnapshot(collection(db, "rooms"), s => { allRooms = []; s.forEach(d => allRooms.push({ id: d.id, ...d.data() })); renderList(); });
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
      }
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      renderList();
    }
    document.getElementById('tab-chats').onclick = () => switchTab('chats');
    document.getElementById('tab-users').onclick = () => switchTab('users');
    document.getElementById('tab-spy').onclick = () => switchTab('spy');

    function renderList() {
      const box = document.getElementById('main-list'), myMail = currentUser.email.toLowerCase();
      box.innerHTML = '';
      if (currentTab === 'users') {
        allUsers.forEach(u => {
          if (u.email === myMail) return;
          const div = document.createElement('div'); div.className = 'chat-item';
          div.innerHTML = '<div><strong>' + u.email.split('@')[0] + '</strong><div style="font-size:12px; color:#8696a0;">' + u.email + '</div></div><span class="badge">DM</span>';
          div.onclick = async () => {
            const pair = [myMail, u.email].sort(), roomId = "dm_" + pair.join("_").replace(/[^a-z0-9]/g, "_");
            await setDoc(doc(db, "rooms", roomId), { name: pair.join(" & "), type: "dm", members: pair, createdBy: myMail }, { merge: true });
            openRoom(roomId, u.email.split('@')[0], u.email);
          };
          box.appendChild(div);
        });
      } else if (currentTab === 'chats') {
        allRooms.filter(r => r.type === 'public' || (r.members && r.members.includes(myMail))).forEach(r => {
          let title = r.name, sub = r.type === 'dm' ? 'Personal' : 'Group (' + r.members.length + ')';
          if (r.type === 'dm') { const other = r.members.find(m => m !== myMail) || myMail; title = other.split('@')[0]; sub = other; }
          const div = document.createElement('div'); div.className = 'chat-item';
          div.innerHTML = '<div><strong>' + title + '</strong><div style="font-size:12px; color:#8696a0;">' + sub + '</div></div><span class="badge">' + (r.type === 'dm' ? 'DM' : 'Group') + '</span>';
          div.onclick = () => openRoom(r.id, title, sub);
          box.appendChild(div);
        });
      } else if (currentTab === 'spy' && isAdmin) {
        allRooms.forEach(r => {
          const title = r.type === 'dm' ? 'DM: ' + r.members.join(' <-> ') : r.name;
          const div = document.createElement('div'); div.className = 'chat-item';
          div.innerHTML = '<div><strong style="color:#fca5a5;">' + title + '</strong><div style="font-size:11px; color:#8696a0;">By: ' + (r.createdBy || 'System') + '</div></div><span class="badge badge-admin">Spy</span>';
          div.onclick = () => openRoom(r.id, title, "Admin View");
          box.appendChild(div);
        });
      }
    }

    document.getElementById('create-group-btn').onclick = async () => {
      const gName = document.getElementById('new-group-name').value.trim();
      if (!gName) return alert("Group ka naam likhein!");
      const checked = Array.from(document.querySelectorAll('.g-member-cb:checked')).map(cb => cb.value);
      const myMail = currentUser.email.toLowerCase(), members = Array.from(new Set([myMail, ...checked]));
      const docRef = await addDoc(collection(db, "rooms"), { name: gName, type: "group", members: members, createdBy: myMail });
      document.getElementById('group-modal').style.display = 'none'; document.getElementById('new-group-name').value = '';
      openRoom(docRef.id, gName, members.length + " members");
    };

    function openRoom(roomId, title, sub) {
      activeRoomId = roomId;
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      document.getElementById('room-title').innerText = title;
      document.getElementById('room-sub').innerText = sub;
      if (unsubMessages) unsubMessages();
      const myMail = currentUser.email.toLowerCase();
      unsubMessages = onSnapshot(query(collection(db, "rooms", roomId, "messages"), orderBy("timestamp")), snap => {
        const msgBox = document.getElementById('messages'); msgBox.innerHTML = '';
        snap.forEach(docSnap => {
          const data = docSnap.data(), isMine = data.sender === myMail;
          if (!isMine && (!data.seenBy || !data.seenBy.includes(myMail))) updateDoc(doc(db, "rooms", roomId, "messages", docSnap.id), { seenBy: arrayUnion(myMail) }).catch(() => {});
          const seenCount = (data.seenBy || []).filter(e => e !== data.sender).length;
          const div = document.createElement('div'); div.className = 'msg ' + (isMine ? 'mine' : '');
          const meta = document.createElement('div'); meta.className = 'msg-meta';
          meta.innerHTML = '<span style="color:#53bdeb; font-weight:bold;">' + data.sender + (data.isAdmin ? ' <span class="red-tick">A</span>' : '') + '</span>';
          if (isMine || isAdmin) {
            const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.innerText = 'Del';
            delBtn.onclick = () => deleteDoc(doc(db, "rooms", activeRoomId, "messages", docSnap.id));
            meta.appendChild(delBtn);
          }
          div.appendChild(meta);
          if (data.text) { const t = document.createElement('div'); t.innerText = data.text; div.appendChild(t); }
          if (data.image) { const im = document.createElement('img'); im.src = data.image; div.appendChild(im); }
          const ft = document.createElement('div'); ft.className = 'msg-footer';
          ft.innerHTML = '<span>' + new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span> ' + (isMine ? (seenCount > 0 ? '<span class="seen-blue">Seen</span>' : '<span>Sent</span>') : '');
          div.appendChild(ft); msgBox.appendChild(div);
        });
        msgBox.scrollTop = msgBox.scrollHeight;
      });
    }

    document.getElementById('back-btn').onclick = () => { if (unsubMessages) unsubMessages(); activeRoomId = null; document.getElementById('chat-screen').style.display = 'none'; document.getElementById('home-screen').style.display = 'flex'; };
    document.getElementById('send-btn').onclick = async () => {
      const input = document.getElementById('msg-input'), text = input.value.trim();
      if (!text || !activeRoomId) return;
      input.value = ''; const myMail = currentUser.email.toLowerCase();
      await addDoc(collection(db, "rooms", activeRoomId, "messages"), { text: text, sender: myMail, isAdmin: isAdmin, seenBy: [myMail], timestamp: Date.now() });
    };
    document.getElementById('cam-btn').onclick = () => document.getElementById('photo-input').click();
    document.getElementById('photo-input').onchange = e => {
      const file = e.target.files[0]; if (!file || !activeRoomId) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = async () => {
          const c = document.createElement('canvas'), s = Math.min(600 / img.width, 1); c.width = img.width * s; c.height = img.height * s;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const myMail = currentUser.email.toLowerCase();
          await addDoc(collection(db, "rooms", activeRoomId, "messages"), { image: c.toDataURL('image/jpeg', 0.7), sender: myMail, isAdmin: isAdmin, seenBy: [myMail], timestamp: Date.now() });
        }; img.src = ev.target.result;
      }; reader.readAsDataURL(file);
    };
    document.getElementById('open-group-btn').onclick = () => {
      const box = document.getElementById('group-user-checkboxes'), myMail = currentUser.email.toLowerCase();
      const others = allUsers.filter(u => u.email !== myMail);
      box.innerHTML = others.length ? others.map(u => '<label style="display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px;"><input type="checkbox" class="g-member-cb" value="' + u.email + '" style="width:auto; margin:0;"> ' + u.email + '</label>').join('') : '<p style="font-size:12px; color:#8696a0;">No other users yet.</p>';
      document.getElementById('group-modal').style.display = 'flex';
    };
    document.getElementById('close-group-btn').onclick = () => document.getElementById('group-modal').style.display = 'none';
    document.getElementById('open-theme-btn').onclick = () => document.getElementById('theme-modal').style.display = 'flex';
    document.getElementById('chat-theme-btn').onclick = () => document.getElementById('theme-modal').style.display = 'flex';
    document.getElementById('close-theme-btn').onclick = () => document.getElementById('theme-modal').style.display = 'none';
    document.getElementById('admin-open-btn').onclick = () => document.getElementById('admin-modal').style.display = 'flex';
    document.getElementById('close-admin-btn').onclick = () => document.getElementById('admin-modal').style.display = 'none';
    document.querySelectorAll('.dot').forEach(d => d.onclick = () => { const h = d.getAttribute('data-color'); document.documentElement.style.setProperty('--bubble-mine', h); localStorage.setItem('ix_bubble_color', h); });
    document.getElementById('my-wallpaper-input').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'), s = Math.min(800 / img.width, 1); c.width = img.width * s; c.height = img.height * s;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const d = c.toDataURL('image/jpeg', 0.6);
          localStorage.setItem('ix_wallpaper', d); document.getElementById('chat-screen').style.backgroundImage = "url(" + d + ")"; alert("Wallpaper set!");
        }; img.src = ev.target.result;
      }; reader.readAsDataURL(file);
    };
    document.getElementById('clear-wall-btn').onclick = () => { localStorage.removeItem('ix_wallpaper'); document.getElementById('chat-screen').style.backgroundImage = 'none'; };
    document.getElementById('update-banner-btn').onclick = async () => {
      const text = document.getElementById('banner-input').value.trim(); if (!text) return;
      await setDoc(doc(db, "settings", "config"), { banner: text }, { merge: true });
      document.getElementById('admin-modal').style.display = 'none'; alert("Notice updated!");
    };
  </script>
</body>
</html>
