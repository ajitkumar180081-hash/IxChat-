<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IxChat Private</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; }
    #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; }
    .login-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .login-box h2 { margin-bottom: 15px; color: #00a884; }
    .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #2a3942; color: white; font-size: 16px; }
    .login-box button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #00a884; color: #111b21; font-weight: bold; font-size: 16px; cursor: pointer; }
    #chat-screen { display: none; flex-direction: column; height: 100%; background-size: cover; background-position: center; }
    .header { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    .admin-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; display: none; }
    #announcement-bar { background: rgba(0, 168, 132, 0.25); border-bottom: 1px solid #00a884; padding: 8px 12px; font-size: 13px; text-align: center; }
    #admin-panel { display: none; background: #202c33; padding: 15px; border-bottom: 2px solid #ef4444; }
    #admin-panel input { width: 100%; padding: 8px; margin: 5px 0; border-radius: 6px; border: none; background: #2a3942; color: white; }
    #admin-panel button { background: #00a884; color: black; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-top: 5px; }
    #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; background: #202c33; align-self: flex-start; word-wrap: break-word; }
    .msg.mine { background: #005c4b; align-self: flex-end; }
    .sender-name { font-size: 12px; font-weight: bold; color: #53bdeb; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .red-tick { background: #ef4444; color: white; border-radius: 50%; width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
    .input-bar { background: #202c33; padding: 10px; display: flex; gap: 8px; align-items: center; }
    .input-bar input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none; }
    .icon-btn { background: #2a3942; color: #e9edef; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .send-btn { background: #00a884; color: #111b21; font-weight: bold; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>IxChat Private</h2>
      <p style="font-size: 12px; color: #8696a0; margin-bottom: 10px;">Sirf Admin dwara di gayi ID se login karein</p>
      <input type="email" id="email" placeholder="Apni Email ID daalein">
      <input type="password" id="password" placeholder="Password daalein">
      <button id="login-btn">Login Karein</button>
      <p id="login-error" style="color: #ef4444; font-size: 13px; margin-top: 10px; font-weight: bold;"></p>
    </div>
  </div>

  <div id="chat-screen">
    <div class="header">
      <div>
        <h3>IxChat Group</h3>
        <span id="user-display" style="font-size: 11px; color: #8696a0;"></span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="admin-toggle-btn" class="admin-btn">Admin Controls</button>
        <button id="logout-btn" style="background:#2a3942; color:white; border:none; padding:6px 10px; border-radius:6px; font-size:12px;">Logout</button>
      </div>
    </div>

    <div id="announcement-bar">Welcome to IxChat!</div>

    <div id="admin-panel">
      <p style="font-size: 12px; color: #ef4444; font-weight: bold;">Admin Customization</p>
      <input type="text" id="custom-banner-input" placeholder="Top par likhne ke liye text likhein...">
      <button id="update-banner-btn">Text Update Karein</button>
      <br><br>
      <label style="font-size: 12px;">App Wallpaper Badlein:</label>
      <input type="file" id="wallpaper-input" accept="image/*">
    </div>

    <div id="messages"></div>

    <div class="input-bar">
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;">
      <button class="icon-btn" id="cam-btn">📷</button>
      <input type="text" id="msg-input" placeholder="Message likhein...">
      <button class="icon-btn send-btn" id="send-btn">➤</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgv2pmfJv_ki7iZkdWlU4u1RbLM0p3JsA",
      authDomain: "ixchat-92440.firebaseapp.com",
      projectId: "ixchat-92440",
      storageBucket: "ixchat-92440.firebasestorage.app",
      messagingSenderId: "164527066733",
      appId: "1:164527066733:web:50bcffc97f0dc90e8f3964",
      measurementId: "G-Q06D8YLFE1"
    };

    const ADMIN_EMAIL = "ajitkumar180081@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    const errBox = document.getElementById('login-error');

    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (!email || !pass) {
        errBox.innerText = "Email aur Password dono daalein!";
        return;
      }
      errBox.style.color = "#00a884";
      errBox.innerText = "Login ho raha hai, rukiye...";
      
      signInWithEmailAndPassword(auth, email, pass)
        .catch(err => {
          errBox.style.color = "#ef4444";
          errBox.innerText = "Error: " + err.code;
        });
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    document.getElementById('admin-toggle-btn').addEventListener('click', () => {
      const panel = document.getElementById('admin-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('user-display').innerText = user.email;
        
        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          document.getElementById('admin-toggle-btn').style.display = 'block';
        }
        loadMessages();
        loadSettings();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('chat-screen').style.display = 'none';
      }
    });

    document.getElementById('send-btn').addEventListener('click', async () => {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await addDoc(collection(db, "messages"), {
        text: text,
        sender: currentUser.email,
        isAdmin: currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase(),
        timestamp: Date.now()
      });
    });

    document.getElementById('cam-btn').addEventListener('click', () => {
      document.getElementById('photo-input').click();
    });

    document.getElementById('photo-input').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(600 / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          await addDoc(collection(db, "messages"), {
            image: compressedBase64,
            sender: currentUser.email,
            isAdmin: currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase(),
            timestamp: Date.now()
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('update-banner-btn').addEventListener('click', async () => {
      const text = document.getElementById('custom-banner-input').value.trim();
      if (!text) return;
      await setDoc(doc(db, "settings", "config"), { banner: text }, { merge: true });
      alert("Text update ho gaya!");
    });

    document.getElementById('wallpaper-input').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(800 / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const bgBase64 = canvas.toDataURL('image/jpeg', 0.6);
          await setDoc(doc(db, "settings", "config"), { wallpaper: bgBase64 }, { merge: true });
          alert("Wallpaper badal gaya!");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("timestamp"));
      onSnapshot(q, (snapshot) => {
        const msgBox = document.getElementById('messages');
        msgBox.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const isMine = data.sender === currentUser.email;
          const name = data.sender.split('@')[0];
          const tickHTML = data.isAdmin ? `<span class="red-tick">✓</span>` : '';
          const div = document.createElement('div');
          div.className = `msg ${isMine ? 'mine' : ''}`;
          div.innerHTML = `
            <div class="sender-name">${name} ${tickHTML}</div>
            ${data.text ? `<div>${data.text}</div>` : ''}
            ${data.image ? `<img src="${data.image}" />` : ''}
          `;
          msgBox.appendChild(div);
        });
        msgBox.scrollTop = msgBox.scrollHeight;
      });
    }

    function loadSettings() {
      onSnapshot(doc(db, "settings", "config"), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.banner) document.getElementById('announcement-bar').innerText = data.banner;
          if (data.wallpaper) document.getElementById('chat-screen').style.backgroundImage = `url(${data.wallpaper})`;
        }
      });
    }
  </script>
</body>
</html>
